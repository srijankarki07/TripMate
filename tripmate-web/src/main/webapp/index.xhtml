<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      lang="en">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>TripMate</title>
    <h:outputStylesheet library="css" name="tripmate.css"/>
</h:head>

<h:body>
    <main class="tm-auth-page">

        <div class="tm-auth-card">
            <p class="tm-eyebrow">Group trip planning and expense tracking</p>
            <h1 class="tm-display-lg">TripMate</h1>
            <p class="tm-body-sm tm-text-muted">
                A shared itinerary and a running record of who paid for what, for a
                small group of travellers.
            </p>

            <h:panelGroup layout="block" rendered="#{currentUser.loggedIn}">
                <p class="tm-body-sm">
                    Signed in as <strong>#{currentUser.fullName}</strong>.
                </p>
                <div class="tm-actions">
                    <p:button outcome="/dashboard.xhtml" value="Go to the dashboard"
                              styleClass="tm-button-block"/>
                </div>
            </h:panelGroup>

            <h:panelGroup layout="block" rendered="#{not currentUser.loggedIn}">
                <div class="tm-actions">
                    <p:button outcome="/login.xhtml" value="Sign in" styleClass="tm-button-block"/>
                </div>
                <p class="tm-body-sm tm-text-muted tm-auth-alt">
                    No account yet?
                    <h:link outcome="/register.xhtml" value="Create one"/>
                </p>
            </h:panelGroup>
        </div>

    </main>
</h:body>
</html>

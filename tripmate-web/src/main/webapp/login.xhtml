<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      lang="en">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Sign in · TripMate</title>
    <h:outputStylesheet library="css" name="tripmate.css"/>
</h:head>

<h:body>
    <main class="tm-auth-page">

        <div class="tm-auth-card">
            <p class="tm-eyebrow">TripMate</p>
            <h1 class="tm-display-lg">Sign in</h1>
            <p class="tm-body-sm tm-text-muted">
                Group trip planning and expense tracking.
            </p>

            <h:form>
                <div class="tm-field">
                    <label class="tm-field-label" for="email">Email</label>
                    <p:inputText id="email"
                                 styleClass="tm-input-full"
                                 value="#{loginBean.email}"
                                 required="true"
                                 requiredMessage="Enter your email address."
                                 autocomplete="username"/>
                    <p:message for="email" display="text" styleClass="tm-field-error"/>
                </div>

                <div class="tm-field">
                    <label class="tm-field-label" for="password">Password</label>
                    <p:password id="password"
                                styleClass="tm-input-full"
                                value="#{loginBean.password}"
                                required="true"
                                requiredMessage="Enter your password."
                                feedback="false"
                                autocomplete="current-password"/>
                    <p:message for="password" display="text" styleClass="tm-field-error"/>
                </div>

                <h:panelGroup layout="block"
                              styleClass="tm-error"
                              rendered="#{not empty loginBean.error}">
                    <h:outputText value="#{loginBean.error}"/>
                </h:panelGroup>

                <div class="tm-actions">
                    <p:commandButton value="Sign in"
                                     action="#{loginBean.login}"
                                     ajax="false"
                                     styleClass="tm-button-block"/>
                </div>
            </h:form>

            <p class="tm-body-sm tm-text-muted tm-auth-alt">
                No account yet?
                <h:link outcome="/register.xhtml" value="Create one"/>
            </p>

            <p class="tm-caption-sm tm-text-muted tm-auth-hint">
                The sample data signs in as <strong>alice@tripmate.test</strong>
                with the password <strong>tripmate123</strong>.
            </p>
        </div>

    </main>
</h:body>
</html>

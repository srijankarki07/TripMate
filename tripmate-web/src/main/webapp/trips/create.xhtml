<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="jakarta.faces.facelets"
      lang="en">
<h:head>
    <meta charset="UTF-8"/>
</h:head>
<h:body>

<ui:composition template="/WEB-INF/templates/layout.xhtml">
    <ui:define name="title">New trip · TripMate</ui:define>

    <ui:define name="content">

        <header class="tm-hero">
            <p class="tm-eyebrow">Trips</p>
            <h1 class="tm-title">New trip</h1>
            <p class="tm-lede">
                You become the trip's administrator, which lets you invite and
                remove members.
            </p>
        </header>

        <section class="tm-card">
            <h:form>

                <div class="tm-field">
                    <label class="tm-field-label" for="tripName">Trip name</label>
                    <p:inputText id="tripName"
                                 styleClass="tm-input-full"
                                 value="#{tripCreateBean.tripName}"
                                 required="true"
                                 requiredMessage="Give the trip a name."/>
                    <p:message for="tripName" display="text" styleClass="tm-field-error"/>
                </div>

                <div class="tm-form-grid">
                    <div class="tm-field">
                        <label class="tm-field-label" for="destination">Destination</label>
                        <p:inputText id="destination"
                                     styleClass="tm-input-full"
                                     value="#{tripCreateBean.destination}"/>
                    </div>

                    <div class="tm-field">
                        <label class="tm-field-label" for="status">State</label>
                        <p:selectOneMenu id="status"
                                         styleClass="tm-input-full"
                                         value="#{tripCreateBean.status}">
                            <f:selectItems value="#{tripCreateBean.statuses}" var="s"
                                           itemLabel="#{s}" itemValue="#{s}"/>
                        </p:selectOneMenu>
                    </div>

                    <div class="tm-field">
                        <label class="tm-field-label" for="startDate">Start date</label>
                        <p:datePicker id="startDate"
                                      value="#{tripCreateBean.startDate}"
                                      pattern="yyyy-MM-dd"
                                      showButtonBar="true"/>
                    </div>

                    <div class="tm-field">
                        <label class="tm-field-label" for="endDate">End date</label>
                        <p:datePicker id="endDate"
                                      value="#{tripCreateBean.endDate}"
                                      pattern="yyyy-MM-dd"
                                      showButtonBar="true"/>
                    </div>
                </div>

                <div class="tm-field">
                    <label class="tm-field-label" for="description">Notes (optional)</label>
                    <p:inputTextarea id="description"
                                     styleClass="tm-input-full"
                                     rows="3"
                                     value="#{tripCreateBean.description}"/>
                </div>

                <h:panelGroup layout="block" styleClass="tm-error"
                              rendered="#{not empty tripCreateBean.error}">
                    <h:outputText value="#{tripCreateBean.error}"/>
                </h:panelGroup>

                <div class="tm-actions">
                    <p:commandButton value="Create trip"
                                     action="#{tripCreateBean.create}"
                                     ajax="false"/>
                    <p:button outcome="/trips/list.xhtml" value="Cancel"
                              styleClass="ui-button-secondary"/>
                </div>

            </h:form>
        </section>

    </ui:define>
</ui:composition>

</h:body>
</html>

<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:tm="jakarta.faces.composite/tm"
      xmlns:ui="jakarta.faces.facelets"
      lang="en">
<h:head>
    <meta charset="UTF-8"/>
</h:head>
<h:body>

<ui:composition template="/WEB-INF/templates/layout.xhtml">

    <f:metadata>
        <f:viewParam name="tripId" value="#{expenseBean.tripId}"/>
        <f:viewAction action="#{expenseBean.load}"/>
    </f:metadata>

    <ui:define name="title">Expenses · #{expenseBean.trip.tripName}</ui:define>

    <ui:define name="content">
        <tm:error title="This page could not be loaded"
                  text="#{expenseBean.loadError}"
                  rendered="#{not empty expenseBean.loadError}">
            <f:facet name="action">
                <p:button outcome="/trips/list.xhtml" value="Back to your trips"
                          styleClass="ui-button-secondary"/>
            </f:facet>
        </tm:error>



        <ui:fragment rendered="#{expenseBean.loaded}">

            <header class="tm-hero">
                <p class="tm-eyebrow">
                    <h:link outcome="/trips/detail.xhtml" value="#{expenseBean.trip.tripName}">
                        <f:param name="tripId" value="#{expenseBean.tripId}"/>
                    </h:link>
                </p>
                <h1 class="tm-title">Expenses</h1>
                <p class="tm-lede">
                    NPR #{expenseBean.expenseTotal} across
                    #{expenseBean.expenses.size()} expenses.
                </p>
            </header>



            <!-- ============================================================
                 Add an expense
                 ============================================================ -->
            <section class="tm-card">
                <h2 class="tm-display-sm">Log an expense</h2>

                <h:form id="expenseForm">

                    <div class="tm-form-grid">
                        <div class="tm-field">
                            <label class="tm-field-label" for="description">What</label>
                            <p:inputText id="description" styleClass="tm-input-full"
                                         value="#{expenseBean.description}"
                                         required="true"
                                         requiredMessage="Say what the expense was for."/>
                            <p:message for="description" display="text" styleClass="tm-field-error"/>
                        </div>
                        <div class="tm-field">
                            <label class="tm-field-label" for="amount">Amount (NPR)</label>
                            <p:inputText id="amount" styleClass="tm-input-full"
                                         value="#{expenseBean.amount}"
                                         required="true"
                                         requiredMessage="Enter the amount.">
                                <f:validateDoubleRange minimum="0.01"
                                                       message="The amount must be greater than zero."/>
                            </p:inputText>
                            <p:message for="amount" display="text" styleClass="tm-field-error"/>
                        </div>
                        <div class="tm-field">
                            <label class="tm-field-label" for="category">Category</label>
                            <p:selectOneMenu id="category" styleClass="tm-input-full"
                                             editable="true"
                                             value="#{expenseBean.category}">
                                <f:selectItems value="#{expenseBean.categories}" var="c"
                                               itemLabel="#{c}" itemValue="#{c}"/>
                            </p:selectOneMenu>
                        </div>
                        <div class="tm-field">
                            <label class="tm-field-label" for="expenseDate">Date</label>
                            <p:datePicker id="expenseDate" pattern="yyyy-MM-dd"
                                          value="#{expenseBean.expenseDate}"
                                          required="true"
                                          requiredMessage="Choose the date."/>
                            <p:message for="expenseDate" display="text" styleClass="tm-field-error"/>
                        </div>
                        <div class="tm-field">
                            <label class="tm-field-label" for="paidBy">Paid by</label>
                            <p:selectOneMenu id="paidBy" styleClass="tm-input-full"
                                             value="#{expenseBean.paidById}">
                                <f:selectItems value="#{expenseBean.members}" var="m"
                                               itemLabel="#{m.fullName}" itemValue="#{m.userId}"/>
                            </p:selectOneMenu>
                        </div>
                    </div>

                    <!-- ================================================
                         Split editor
                         ================================================ -->
                    <h3 class="tm-display-sm">Who shares it</h3>
                    <p class="tm-body-sm tm-text-muted">
                        Tick everyone who shares this cost, then split it equally or
                        type each share. The shares have to add up to the amount.
                    </p>

                    <p:dataTable reflow="true" rowHover="true" id="splitTable" value="#{expenseBean.splits}" var="row"
                                 styleClass="tm-table" emptyMessage="">
                        <p:column headerText="Included" styleClass="tm-col-narrow" width="8rem">
                            <p:selectBooleanCheckbox value="#{row.included}"/>
                        </p:column>
                        <p:column headerText="Person">
                            <span class="tm-split-person">
                                <span class="tm-avatar tm-avatar-sm" aria-hidden="true">
                                    <h:outputText value="#{row.initials}"/>
                                </span>
                                <h:outputText value="#{row.name}"/>
                            </span>
                        </p:column>
                        <p:column headerText="Share (NPR)" width="12rem">
                            <p:inputText value="#{row.amount}"
                                         rendered="#{row.included}"
                                         styleClass="tm-input-narrow"/>
                            <h:outputText value="Not sharing"
                                          styleClass="tm-text-muted tm-body-sm"
                                          rendered="#{not row.included}"/>
                        </p:column>
                    </p:dataTable>

                    <div class="tm-actions">
                        <p:commandButton value="Split equally"
                                         action="#{expenseBean.splitEqually}"
                                         update="@form"
                                         ajax="true"/>
                        <p:commandButton value="Clear shares"
                                         styleClass="ui-button-secondary"
                                         action="#{expenseBean.clearSplit}"
                                         update="@form"
                                         ajax="true"/>
                    </div>

                    <!-- ================================================
                         The meter

                         The figure was already here as a sentence, and a
                         sentence is not what this needs: what a reader is
                         checking is whether the bar is full. The bar is the
                         answer at a glance, the sentence is the answer to the
                         nearest rupee, and the state colour is the same three
                         tones used everywhere else so "still to assign" reads
                         as a warning rather than as a number to interpret.
                         ================================================ -->
                    <div class="tm-meter">
                        <div class="tm-meter-head">
                            <span class="tm-meter-label">
                                <h:outputText value="Shares"
                                              rendered="#{not expenseBean.amountEntered}"/>
                                <h:outputText value="Still to assign"
                                              rendered="#{expenseBean.amountEntered and expenseBean.showRemainder}"/>
                                <h:outputText value="Assigned"
                                              rendered="#{expenseBean.amountEntered and not expenseBean.showRemainder}"/>
                            </span>
                            <span class="tm-meter-value">
                                <h:outputText value="NPR #{expenseBean.splitTotal} of NPR #{expenseBean.amountOrZero}"
                                              rendered="#{expenseBean.showRemainder}"/>
                                <h:outputText value="NPR #{expenseBean.splitTotal}"
                                              styleClass="#{expenseBean.amountEntered ? 'tm-text-success' : 'tm-text-muted'}"
                                              rendered="#{not expenseBean.showRemainder}"/>
                            </span>
                        </div>

                        <div class="tm-meter-track"
                             role="progressbar"
                             aria-valuemin="0"
                             aria-valuemax="100"
                             aria-valuenow="#{expenseBean.assignedPercent}"
                             aria-label="Share of the amount assigned">
                            <span class="tm-meter-fill #{expenseBean.showRemainder ? 'tm-meter-fill-warning' : 'tm-meter-fill-success'}"
                                  style="width:#{expenseBean.assignedPercent}%"></span>
                        </div>

                        <p class="tm-meter-note">
                            <h:outputText value="Enter an amount above, then divide it between the people sharing the cost."
                                          styleClass="tm-text-muted"
                                          rendered="#{not expenseBean.amountEntered}"/>
                            <h:outputText value="NPR #{expenseBean.unassigned} is not yet assigned to anybody."
                                          styleClass="tm-text-warning"
                                          rendered="#{expenseBean.amountEntered and expenseBean.showRemainder}"/>
                            <h:outputText value="The shares add up to the amount."
                                          styleClass="tm-text-success"
                                          rendered="#{expenseBean.amountEntered and not expenseBean.showRemainder}"/>
                        </p>
                    </div>

                    <div class="tm-actions">
                        <p:commandButton value="Save expense"
                                         action="#{expenseBean.save}"
                                         ajax="false"/>
                    </div>

                </h:form>
            </section>

            <!-- ============================================================
                 What has been logged
                 ============================================================ -->
            <section class="tm-card">
                <h2 class="tm-display-sm">Logged so far</h2>

                <h:form id="expenseListForm">
                    <p:dataTable reflow="true" rowHover="true" value="#{expenseBean.expenses}" var="expense"
                                 rendered="#{expenseBean.hasExpenses}" emptyMessage="">
                        <p:column headerText="Date" sortBy="#{expense.expenseDate}">
                            <h:outputText value="#{expense.expenseDate}"/>
                        </p:column>
                        <p:column headerText="What" sortBy="#{expense.description}">
                            <h:outputText value="#{expense.description}"/>
                        </p:column>
                        <p:column headerText="Category" sortBy="#{expense.category}">
                            <h:outputText value="#{expense.category}"/>
                        </p:column>
                        <p:column headerText="Paid by">
                            <h:outputText value="#{expense.paidByName}"/>
                        </p:column>
                        <p:column headerText="Split">
                            <h:outputText value="#{expense.splits.size()}"/>
                            <h:outputText value=" ways"/>
                        </p:column>
                        <p:column headerText="Amount" sortBy="#{expense.amount}">
                            <h:outputText value="NPR #{expense.amount}"/>
                        </p:column>
                        <p:column headerText="">
                            <p:commandButton value="Delete"
                                             styleClass="ui-button-secondary"
                                             action="#{expenseBean.delete(expense.expenseId)}"
                                             ajax="false"
                                             >
                            <p:confirm header="Delete this expense?"
                                       message="The expense and every share of it are removed, and the balances change accordingly. It cannot be undone."/>
                        </p:commandButton>
                        </p:column>
                    </p:dataTable>
                </h:form>

                <tm:empty icon="pi-receipt"
                          title="Nothing logged yet"
                          text="Log the first expense above. Everyone who shares it gets a split, and the balances update as soon as it is saved."
                          rendered="#{not expenseBean.hasExpenses}"/>
            </section>

        </ui:fragment>

    </ui:define>
</ui:composition>

</h:body>
</html>

<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:tm="jakarta.faces.composite/tm"
      xmlns:ui="jakarta.faces.facelets"
      lang="en">
<h:head>
    <meta charset="UTF-8"/>
</h:head>
<h:body>

<ui:composition template="/WEB-INF/templates/layout.xhtml">

    <f:metadata>
        <f:viewParam name="tripId" value="#{itineraryBean.tripId}"/>
        <f:viewAction action="#{itineraryBean.load}"/>
    </f:metadata>

    <ui:define name="title">Itinerary · #{itineraryBean.trip.tripName}</ui:define>

    <ui:define name="content">
        <tm:error title="This page could not be loaded"
                  text="#{itineraryBean.loadError}"
                  rendered="#{not empty itineraryBean.loadError}">
            <f:facet name="action">
                <p:button outcome="/trips/list.xhtml" value="Back to your trips"
                          styleClass="ui-button-secondary"/>
            </f:facet>
        </tm:error>



        <ui:fragment rendered="#{itineraryBean.loaded}">

            <header class="tm-hero">
                <p class="tm-eyebrow">
                    <h:link outcome="/trips/detail.xhtml" value="#{itineraryBean.trip.tripName}">
                        <f:param name="tripId" value="#{itineraryBean.tripId}"/>
                    </h:link>
                </p>
                <h1 class="tm-title">Itinerary</h1>
                <p class="tm-lede">
                    #{itineraryBean.items.size()} items, in the order you will
                    experience them.
                </p>
            </header>


            <!-- ============================================================
                 The form, which adds or edits depending on state
                 ============================================================ -->
            <section class="tm-card">
                <h2 class="tm-display-sm">
                    <h:outputText value="#{itineraryBean.editing ? 'Edit item' : 'Add an item'}"/>
                </h2>

                <h:form id="itemForm">
                    <div class="tm-form-grid">
                        <div class="tm-field">
                            <label class="tm-field-label" for="title">What</label>
                            <p:inputText id="title" styleClass="tm-input-full"
                                         value="#{itineraryBean.form.title}"
                                         required="true"
                                         requiredMessage="Give the item a title."/>
                            <p:message for="title" display="text" styleClass="tm-field-error"/>
                        </div>
                        <div class="tm-field">
                            <label class="tm-field-label" for="itemDate">Day</label>
                            <p:datePicker id="itemDate" pattern="yyyy-MM-dd"
                                          value="#{itineraryBean.form.itemDate}"
                                          required="true"
                                          requiredMessage="Choose a day."/>
                            <p:message for="itemDate" display="text" styleClass="tm-field-error"/>
                        </div>
                        <div class="tm-field">
                            <label class="tm-field-label" for="startTime">Starts</label>
                            <p:selectOneMenu id="startTime" styleClass="tm-input-full"
                                             converter="localTimeConverter"
                                             value="#{itineraryBean.form.startTime}">
                                <f:selectItem itemLabel="Not set" itemValue="#{null}"/>
                                <f:selectItems value="#{itineraryBean.quarterHours}" var="t"
                                               itemLabel="#{t}" itemValue="#{t}"/>
                            </p:selectOneMenu>
                            <p:message for="startTime" display="text" styleClass="tm-field-error"/>
                        </div>
                        <div class="tm-field">
                            <label class="tm-field-label" for="endTime">Ends</label>
                            <p:selectOneMenu id="endTime" styleClass="tm-input-full"
                                             converter="localTimeConverter"
                                             value="#{itineraryBean.form.endTime}">
                                <f:selectItem itemLabel="Not set" itemValue="#{null}"/>
                                <f:selectItems value="#{itineraryBean.quarterHours}" var="t"
                                               itemLabel="#{t}" itemValue="#{t}"/>
                            </p:selectOneMenu>
                        </div>
                        <div class="tm-field">
                            <label class="tm-field-label" for="location">Where</label>
                            <p:inputText id="location" styleClass="tm-input-full"
                                         value="#{itineraryBean.form.location}"/>
                        </div>
                    </div>

                    <div class="tm-field">
                        <label class="tm-field-label" for="itemDescription">Notes</label>
                        <p:inputTextarea id="itemDescription" styleClass="tm-input-full" rows="2"
                                         value="#{itineraryBean.form.description}"/>
                    </div>

                    <div class="tm-actions">
                        <p:commandButton value="#{itineraryBean.editing ? 'Save changes' : 'Add to itinerary'}"
                                         action="#{itineraryBean.save}"
                                         ajax="false"/>
                        <p:commandButton value="Cancel edit"
                                         styleClass="ui-button-secondary"
                                         rendered="#{itineraryBean.editing}"
                                         action="#{itineraryBean.cancelEdit}"
                                         update="@form"
                                         ajax="false"/>
                    </div>
                </h:form>
            </section>

            <!-- ============================================================
                 The current itinerary
                 ============================================================ -->
            <section class="tm-card">
                <h2 class="tm-display-sm">Planned so far</h2>

                <!-- Wrapped in its own form: the row buttons are UICommand
                     components and JSF requires a UIForm ancestor, otherwise
                     every page load logs a warning banner in Development. -->
                <h:form id="listForm">
                <p:dataTable reflow="true" rowHover="true" value="#{itineraryBean.items}" var="item"
                             rendered="#{itineraryBean.hasItems}" emptyMessage="">
                    <p:column headerText="Day" sortBy="#{item.itemDate}">
                        <h:outputText value="#{item.itemDate}"/>
                    </p:column>
                    <p:column headerText="Time">
                        <h:outputText value="#{item.startTime}"/>
                        <h:outputText value=" - " rendered="#{not empty item.endTime}"/>
                        <h:outputText value="#{item.endTime}"/>
                    </p:column>
                    <p:column headerText="What">
                        <h:outputText value="#{item.title}"/>
                    </p:column>
                    <p:column headerText="Where">
                        <h:outputText value="#{item.location}"/>
                    </p:column>
                    <p:column headerText="Added by">
                        <h:outputText value="#{item.authorName}"/>
                    </p:column>
                    <p:column headerText="">
                        <p:commandButton value="Edit"
                                         styleClass="ui-button-secondary"
                                         action="#{itineraryBean.edit(item.itemId)}"
                                         update="@form"
                                         ajax="false"/>
                        <p:commandButton value="Copy"
                                         styleClass="ui-button-secondary"
                                         action="#{itineraryBean.duplicate(item.itemId)}"
                                         update="@form"
                                         ajax="false"/>
                        <p:commandButton value="Delete"
                                         styleClass="ui-button-secondary"
                                         action="#{itineraryBean.delete(item.itemId)}"
                                         update="@form"
                                         ajax="false"
                                         >
                            <p:confirm header="Remove this itinerary item?"
                                       message="The item is removed from the plan. This cannot be undone."/>
                        </p:commandButton>
                    </p:column>
                </p:dataTable>
                </h:form>

                <tm:empty icon="pi-calendar"
                          title="Nothing planned yet"
                          text="Add the first item above. A date is all it needs; the times, the place and the note are optional."
                          rendered="#{not itineraryBean.hasItems}"/>
            </section>

        </ui:fragment>

    </ui:define>
</ui:composition>

</h:body>
</html>

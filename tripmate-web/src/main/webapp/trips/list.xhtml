<!DOCTYPE html>
<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:p="http://primefaces.org/ui"
  xmlns:tm="jakarta.faces.composite/tm"
  xmlns:ui="jakarta.faces.facelets"
  lang="en"
>
  <h:head>
    <meta charset="UTF-8" />
  </h:head>
  <h:body>
    <ui:composition template="/WEB-INF/templates/layout.xhtml">
      <!-- The dashboard's "New trip" lands here with the dialog already open,
         so the two entry points lead to the same place. -->
      <f:metadata>
        <f:viewParam name="new" value="#{tripListBean.openRequested}" />
        <f:viewAction action="#{tripListBean.applyOpenRequest}" />
      </f:metadata>

      <ui:define name="title">Your trips</ui:define>
      <ui:define name="breadcrumbs">
        <h:link
          outcome="/dashboard.xhtml"
          value="Dashboard"
          styleClass="tm-crumb"
        />
        <span class="tm-crumb-sep" aria-hidden="true"></span>
        <span class="tm-crumb-current">Trips</span>
      </ui:define>

      <ui:define name="content">
        <header class="tm-hero">
          <h1 class="tm-title">Your trips</h1>
          <p class="tm-lede">
            #{tripListBean.trips.size()} trips, #{tripListBean.upcomingCount} of
            them planned or under way.
          </p>
        </header>

        <section class="tm-card-srijan">
          <div class="tm-toolbar">
            <h2 class="tm-display-sm no-margin">All trips</h2>
            <p:commandButton
              icon="pi pi-plus"
              value="New trip"
              styleClass="ui-button-secondary"
              action="#{tripListBean.openNewTrip}"
              process="@this"
              update="newTripForm"
              ajax="true"
            />
          </div>

          <h:form>
            <p:dataTable
              reflow="true"
              rowHover="true"
              value="#{tripListBean.trips}"
              var="trip"
              rendered="#{tripListBean.hasTrips}"
              emptyMessage=""
              sortMode="single"
              paginator="true"
              rows="10"
              paginatorAlwaysVisible="false"
              paginatorTemplate="{CurrentPageReport} {RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}"
              rowsPerPageTemplate="10,25,50"
              currentPageReportTemplate="{startRecord} to {endRecord} of {totalRecords}"
            >
              <p:column headerText="SN" styleClass="tm-col-sn">
                <h:outputText value="#{tripListBean.trips.indexOf(trip) + 1}" />
              </p:column>

              <p:column headerText="Trip" sortBy="#{trip.tripName}">
                <h:link outcome="/trips/detail.xhtml" value="#{trip.tripName}">
                  <f:param name="tripId" value="#{trip.tripId}" />
                </h:link>
              </p:column>

              <p:column headerText="Where" sortBy="#{trip.destination}">
                <h:outputText value="#{trip.destination}" />
              </p:column>

              <!-- The length in brackets. Two dates say when; what a
                     reader wants beside them is how long, which is arithmetic
                     they should not have to do. -->
              <p:column headerText="Dates" sortBy="#{trip.startDate}">
                <h:outputText value="#{trip.startDate} to #{trip.endDate}" />
                <h:outputText
                  value=" (#{trip.endDate.toEpochDay() - trip.startDate.toEpochDay() + 1}d)"
                  styleClass="tm-cell-muted"
                  rendered="#{trip.startDate ne null and trip.endDate ne null}"
                />
              </p:column>

              <p:column headerText="State" sortBy="#{trip.status}">
                <span
                  class="tm-status tm-status-#{trip.status.name().toLowerCase()}"
                >
                  <h:outputText value="#{trip.status}" />
                </span>
              </p:column>

              <p:column headerText="Admin" sortBy="#{trip.adminName}">
                <h:outputText value="#{trip.adminName}" />
              </p:column>

              <p:column headerText="Members" sortBy="#{trip.memberCount}">
                <h:outputText value="#{trip.memberCount}" />
              </p:column>
            </p:dataTable>
          </h:form>

          <!-- The form is here rather than on a page of its own. It is five
                 fields, and a reader who has just decided to add a trip should
                 not lose the list they were reading to fill them in. -->
          <h:form id="newTripForm">
            <p:dialog
              id="newTripDialog"
              widgetVar="newTripDialogWidget"
              visible="#{tripListBean.dialogOpen}"
              header="New trip"
              modal="true"
              draggable="false"
              resizable="false"
              responsive="true"
              styleClass="tm-dialog"
            >
              <div class="tm-dialog-body">
                <p class="tm-dialog-lede">
                  You become the trip's administrator, which lets you invite and
                  remove members.
                </p>

                <div class="tm-form-grid tm-form-grid-2">
                  <div class="tm-field">
                    <label class="tm-field-label" for="newTripName"
                      >Trip name</label
                    >
                    <p:inputText
                      id="newTripName"
                      styleClass="tm-input-full"
                      value="#{tripListBean.newTrip.tripName}"
                    />
                  </div>
                  <div class="tm-field">
                    <label class="tm-field-label" for="newTripDestination"
                      >Destination</label
                    >
                    <p:inputText
                      id="newTripDestination"
                      styleClass="tm-input-full"
                      value="#{tripListBean.newTrip.destination}"
                    />
                  </div>
                  <div class="tm-field">
                    <label class="tm-field-label" for="newTripStatus"
                      >State</label
                    >
                    <p:selectOneMenu
                      id="newTripStatus"
                      styleClass="tm-input-full"
                      value="#{tripListBean.newTrip.status}"
                    >
                      <f:selectItems
                        value="#{tripListBean.statuses}"
                        var="st"
                        itemLabel="#{st}"
                        itemValue="#{st}"
                      />
                    </p:selectOneMenu>
                  </div>
                  <div class="tm-field">
                    <label class="tm-field-label" for="newTripStart"
                      >Start date</label
                    >
                    <p:datePicker
                      styleClass="tm-input-full"
                      id="newTripStart"
                      pattern="yyyy-MM-dd"
                      value="#{tripListBean.newTrip.startDate}"
                    />
                  </div>
                  <div class="tm-field">
                    <label class="tm-field-label" for="newTripEnd"
                      >End date</label
                    >
                    <p:datePicker
                      styleClass="tm-input-full"
                      id="newTripEnd"
                      pattern="yyyy-MM-dd"
                      value="#{tripListBean.newTrip.endDate}"
                    />
                  </div>
                </div>

                <div class="tm-field">
                  <label class="tm-field-label" for="newTripNotes">Notes</label>
                  <p:inputTextarea
                    id="newTripNotes"
                    styleClass="tm-input-full"
                    rows="2"
                    value="#{tripListBean.newTrip.description}"
                  />
                </div>

                <h:panelGroup
                  layout="block"
                  styleClass="tm-field-error tm-form-error"
                  rendered="#{not empty tripListBean.dialogError}"
                >
                  <i class="pi pi-exclamation-circle" aria-hidden="true"></i>
                  <h:outputText value="#{tripListBean.dialogError}" />
                </h:panelGroup>
              </div>

              <f:facet name="footer">
                <div class="tm-dialog-actions">
                  <!--
                      `process="@this"` on the way out, for the same reason the
                      control that opened this dialog carries it on the way in:
                      without it the whole form is processed, so Cancel
                      validates the fields it is cancelling and never runs.
                  -->
                  <p:commandButton
                    value="Cancel"
                    styleClass="ui-button-secondary"
                    action="#{tripListBean.closeNewTrip}"
                    process="@this"
                    update="@form"
                    ajax="true"
                  />
                  <p:commandButton
                    icon="pi pi-check"
                    value="Create trip"
                    action="#{tripListBean.createTrip}"
                    update="@form tmToasts"
                    ajax="true"
                  />
                </div>
              </f:facet>
            </p:dialog>
          </h:form>

          <tm:empty
            icon="pi-compass"
            title="No trips yet"
            text="Create one and you become its administrator. Everyone you add can plan the itinerary and log what they spend."
            rendered="#{not tripListBean.hasTrips}"
          >
            <f:facet name="action">
              <p:commandButton
                icon="pi pi-plus"
                value="Create a trip"
                styleClass="ui-button-secondary"
                action="#{tripListBean.openNewTrip}"
                process="@this"
                update="newTripForm"
                ajax="true"
              />
            </f:facet>
          </tm:empty>
        </section>
      </ui:define>
    </ui:composition>
  </h:body>
</html>
